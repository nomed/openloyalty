server {
    listen 80;
    server_name _;
    root /var/www/openloyalty/frontend;
    index index.html;

    location ~ ^/app_dev\.php(/|$) {
        root /var/www/openloyalty/web;
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/openloyalty/web$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/openloyalty/web;
    }
    location ~ ^/(admin|client|pos)/(assets/.*|templates/.*|config\.js|admin\.app\.js|client\.app\.js|pos\.app\.js)$ {
        rewrite ^/(admin|client|pos)/(.*)$ /$2 break;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
